<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIDD Knowledge Copilot</title>
  <style>
    :root {
      --bg: #eef3f7;
      --ink: #101828;
      --muted: #667085;
      --subtle: #98a2b3;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: #ffffff;
      --line: rgba(21, 33, 52, 0.12);
      --nav: #14213d;
      --nav-2: #1f3a5f;
      --teal: #0e8f91;
      --cyan: #36b7c9;
      --coral: #d85f45;
      --green: #138a52;
      --amber: #b7791f;
      --blue-soft: #e8f4fb;
      --teal-soft: #e7f6f3;
      --coral-soft: #fff0eb;
      --shadow: 0 20px 60px rgba(17, 24, 39, 0.14);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(14, 143, 145, 0.16), transparent 34%),
        linear-gradient(225deg, rgba(216, 95, 69, 0.11), transparent 36%),
        var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
    }

    .sidebar {
      min-height: 100vh;
      padding: 22px 18px;
      color: #eef7ff;
      background:
        linear-gradient(180deg, rgba(54, 183, 201, 0.15), transparent 34%),
        linear-gradient(160deg, var(--nav), var(--nav-2));
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 12px 0 36px rgba(20, 33, 61, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 3px 3px 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #36b7c9, #d85f45);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
      font-weight: 800;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 18px;
      line-height: 1.24;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .sidebar .sub {
      color: rgba(238, 247, 255, 0.68);
    }

    .nav-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 14px;
    }

    .side-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: rgba(238, 247, 255, 0.72);
      font-size: 12px;
    }

    .topic-list {
      display: grid;
      gap: 8px;
    }

    .topic {
      width: 100%;
      min-height: 42px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 11px;
      border-radius: var(--radius);
      color: rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      text-align: left;
    }

    .topic:hover,
    .topic.active {
      color: #ffffff;
      background: rgba(54, 183, 201, 0.22);
    }

    .count {
      min-width: 28px;
      height: 23px;
      display: inline-grid;
      place-items: center;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      font-size: 12px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      border-radius: var(--radius);
      padding: 9px 12px;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--ink);
      cursor: pointer;
    }

    .btn:hover {
      border-color: rgba(14, 143, 145, 0.45);
      color: var(--teal);
    }

    .btn.primary {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, var(--teal), #156f9a);
      box-shadow: 0 12px 24px rgba(14, 143, 145, 0.22);
    }

    .btn.ghost {
      color: #eaf6ff;
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
    }

    .main {
      height: 100vh;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar {
      padding: 22px 28px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 250, 252, 0.86);
      backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(280px, 560px);
      gap: 18px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(19, 138, 82, 0.12);
    }

    .topbar h2 {
      font-size: 27px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .search-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.05);
    }

    .search-box input:focus,
    textarea:focus,
    label input:focus,
    label textarea:focus,
    label select:focus {
      border-color: rgba(14, 143, 145, 0.62);
      box-shadow: 0 0 0 4px rgba(14, 143, 145, 0.12);
    }

    .workspace {
      min-height: 0;
      overflow: auto;
      padding: 22px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
    }

    .hero-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
    }

    .metric strong {
      display: block;
      margin-bottom: 4px;
      font-size: 22px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .chat-card,
    .research-card,
    .source-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .chat-card {
      min-height: 580px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      min-height: 32px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(16, 24, 40, 0.06);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    .tab.active,
    .tab:hover {
      color: var(--teal);
      background: var(--teal-soft);
    }

    .chat {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: min(780px, 92%);
      border-radius: var(--radius);
      padding: 14px 15px;
      line-height: 1.7;
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.07);
    }

    .msg.bot {
      align-self: flex-start;
      border: 1px solid var(--line);
      background: #ffffff;
    }

    .msg.user {
      align-self: flex-end;
      color: #ffffff;
      background: linear-gradient(135deg, #156f9a, var(--teal));
    }

    .msg strong {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
    }

    .answer-grid {
      display: grid;
      gap: 10px;
    }

    .source-line {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(102, 112, 133, 0.18);
      color: var(--muted);
      font-size: 12px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: #176b87;
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .chip:hover {
      border-color: rgba(14, 143, 145, 0.45);
      background: var(--teal-soft);
    }

    .composer {
      padding: 16px 28px 22px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 50px;
      max-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      outline: none;
      color: var(--ink);
      background: #ffffff;
    }

    .right-rail {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .research-card,
    .source-card {
      padding: 16px;
      box-shadow: 0 12px 32px rgba(17, 24, 39, 0.08);
    }

    .rail-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .rail-title h3 {
      font-size: 15px;
    }

    .article-list,
    .knowledge-list {
      display: grid;
      gap: 10px;
    }

    .article,
    .knowledge-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px;
      background: rgba(255, 255, 255, 0.72);
    }

    .article a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      line-height: 1.35;
    }

    .article a:hover {
      color: var(--teal);
    }

    .tag-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      border-radius: 999px;
      padding: 4px 7px;
      background: var(--blue-soft);
      color: #156f9a;
      font-size: 11px;
    }

    .tag.warn {
      color: var(--amber);
      background: #fff7e6;
    }

    .tag.hot {
      color: var(--coral);
      background: var(--coral-soft);
    }

    .knowledge-item {
      cursor: pointer;
    }

    .knowledge-item:hover {
      border-color: rgba(14, 143, 145, 0.45);
      background: #fff;
    }

    .knowledge-item strong {
      display: block;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .knowledge-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.48);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(780px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 20px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    label input,
    label textarea,
    label select {
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 11px;
      outline: none;
      background: #fff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .empty {
      color: rgba(238, 247, 255, 0.7);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 1120px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .right-rail {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
      }

      .main {
        height: auto;
      }

      .topbar,
      .workspace,
      .composer {
        grid-template-columns: 1fr;
      }

      .hero-strip,
      .right-rail {
        grid-template-columns: 1fr;
      }

      .chat-card {
        min-height: 540px;
      }
    }

    /* Minimal ChatGPT-like shell */
    body {
      background: #ffffff;
    }

    .app {
      display: block;
      min-height: 100vh;
      background: #ffffff;
    }

    .main {
      height: 100vh;
      max-width: 100%;
      grid-template-rows: 64px minmax(0, 1fr) auto;
      background: #ffffff;
    }

    .topbar {
      padding: 0 18px;
      border-bottom: 1px solid #eceff3;
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .title-lockup {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-lockup .logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      box-shadow: none;
      font-size: 12px;
      background: #111827;
      color: #ffffff;
    }

    .title-lockup h1 {
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-lockup .sub {
      margin-top: 2px;
      font-size: 12px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid transparent;
      color: #344054;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .icon-btn:hover {
      border-color: #e4e7ec;
      background: #f7f8fa;
    }

    .tabs {
      padding: 3px;
      border-radius: 10px;
      background: #f2f4f7;
      flex-wrap: nowrap;
    }

    .tab {
      min-height: 30px;
      border-radius: 8px;
      padding: 5px 11px;
      background: transparent;
      color: #667085;
      font-size: 13px;
    }

    .tab.active,
    .tab:hover {
      color: #101828;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
    }

    .workspace {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 18px;
      display: block;
      overflow: hidden;
    }

    .chat-card {
      min-height: 0;
      height: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      display: block;
    }

    .chat {
      height: 100%;
      padding: 30px 0 24px;
      gap: 20px;
      overflow: auto;
    }

    .msg {
      max-width: 100%;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      line-height: 1.78;
      font-size: 15px;
    }

    .msg.bot {
      width: 100%;
      border: 0;
      background: transparent;
    }

    .msg.user {
      align-self: flex-end;
      max-width: min(620px, 86%);
      padding: 10px 14px;
      border-radius: 18px;
      color: #101828;
      background: #f2f4f7;
    }

    .msg strong {
      margin-bottom: 6px;
      font-size: 15px;
    }

    .answer-grid {
      max-width: 760px;
    }

    .source-line {
      color: #667085;
      border-top-color: #eef0f3;
    }

    .suggestions {
      margin-top: 14px;
      gap: 8px;
    }

    .chip {
      border-color: #e4e7ec;
      color: #344054;
      background: #ffffff;
    }

    .chip:hover {
      color: #101828;
      border-color: #cfd4dc;
      background: #f9fafb;
    }

    .composer {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 12px 18px 20px;
      border-top: 0;
      background: #ffffff;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 10px;
      align-items: end;
    }

    .composer textarea {
      min-height: 52px;
      max-height: 160px;
      border-radius: 18px;
      padding: 14px 16px;
      border-color: #d0d5dd;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #ffffff;
      background: #111827;
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .send-btn:hover {
      background: #344054;
    }

    .library-drawer {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: min(380px, 92vw);
      padding: 16px;
      overflow: auto;
      background: #ffffff;
      border-right: 1px solid #e4e7ec;
      box-shadow: 18px 0 60px rgba(16, 24, 40, 0.18);
      transform: translateX(-105%);
      transition: transform 180ms ease;
    }

    body.drawer-open .library-drawer {
      transform: translateX(0);
    }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      background: rgba(16, 24, 40, 0.32);
      cursor: pointer;
    }

    body.drawer-open .drawer-scrim {
      display: block;
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef0f3;
      margin-bottom: 14px;
    }

    .drawer-head h2 {
      font-size: 18px;
    }

    .drawer-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric,
    .nav-card,
    .research-card,
    .source-card {
      border: 1px solid #e4e7ec;
      background: #ffffff;
      box-shadow: none;
    }

    .metric {
      padding: 10px;
    }

    .metric strong {
      font-size: 18px;
    }

    .nav-card,
    .research-card,
    .source-card {
      margin-bottom: 12px;
      padding: 12px;
    }

    .side-title {
      color: #667085;
    }

    .topic {
      color: #344054;
      border: 1px solid #eef0f3;
      background: #ffffff;
    }

    .topic:hover,
    .topic.active {
      color: #101828;
      background: #f6f8fa;
      border-color: #d0d5dd;
    }

    .count {
      color: #667085;
      background: #f2f4f7;
    }

    .btn {
      border-color: #d0d5dd;
      box-shadow: none;
    }

    .btn.primary {
      background: #111827;
      color: #ffffff;
      box-shadow: none;
    }

    .search-box {
      grid-template-columns: 1fr auto;
    }

    .search-box input {
      height: 40px;
      box-shadow: none;
    }

    .article-list,
    .knowledge-list {
      max-height: 360px;
      overflow: auto;
    }

    .article,
    .knowledge-item {
      background: #ffffff;
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 40px 1fr;
      }

      .topbar .tabs {
        grid-column: 1 / -1;
        justify-self: stretch;
      }

      .main {
        grid-template-rows: 104px minmax(0, 1fr) auto;
      }

      .title-lockup .sub {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="drawerBtn" type="button" title="打开资料库">☰</button>
        <div class="title-lockup">
          <div class="logo">AI</div>
          <div>
            <h1>AIDD Knowledge Copilot</h1>
            <p class="sub">本地知识库 · 中间直接问答</p>
          </div>
        </div>
        <div class="tabs" id="modeTabs">
          <button class="tab active" data-mode="answer">问答</button>
          <button class="tab" data-mode="learn">学习路线</button>
          <button class="tab" data-mode="risk">风险检查</button>
        </div>
      </header>

      <section class="workspace">
        <section class="chat-card">
          <div class="chat" id="chat"></div>
        </section>
      </section>

      <form class="composer" id="chatForm">
        <textarea id="questionInput" placeholder="输入你的 AIDD 问题..." required></textarea>

    const storageKey = "aidd-chatbot-knowledge-v3";
    let knowledge = loadKnowledge();
    let activeCategory = "全部";
    let mode = "answer";

    const chat = document.getElementById("chat");
    const topicList = document.getElementById("topicList");
    const totalCount = document.getElementById("totalCount");
    const questionInput = document.getElementById("questionInput");
    const searchInput = document.getElementById("searchInput");
    const modal = document.getElementById("modal");
    const categorySelect = document.getElementById("qaCategory");

    function loadKnowledge() {
      const saved = localStorage.getItem(storageKey);
      if (!saved) return starterKnowledge;
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) && parsed.length ? parsed : starterKnowledge;
      } catch {
        return starterKnowledge;
      }
    }

    function saveKnowledge() {
      localStorage.setItem(storageKey, JSON.stringify(knowledge, null, 2));
    }

    function categories() {
      return [...new Set(knowledge.map((item) => item.category))].sort();
    }

    function normalize(text) {
      return String(text || "").toLowerCase().replace(/[，。！？、；：,.!?;:()（）/\\-]/g, " ");
    }

    function scoreItem(item, query) {
      const q = normalize(query);
      const words = q.split(/\s+/).filter(Boolean);
      const haystack = normalize([item.question, item.category, item.answer, (item.keywords || []).join(" "), (item.sources || []).join(" ")].join(" "));
      let score = 0;
      if (!q) return 0;
      if (normalize(item.question).includes(q)) score += 15;
      if (haystack.includes(q)) score += 8;
      for (const word of words) {
        if (normalize(item.question).includes(word)) score += 5;
        if ((item.keywords || []).some((kw) => normalize(kw).includes(word))) score += 4;
        if (normalize(item.category).includes(word)) score += 3;
        if (normalize(item.answer).includes(word)) score += 1;
      }
      for (const kw of item.keywords || []) {
        if (q.includes(normalize(kw))) score += 5;
      }
      return score;
    }

    function findBest(query) {
      return knowledge
        .map((item) => ({ item, score: scoreItem(item, query) }))
        .sort((a, b) => b.score - a.score);
    }

    function sourceText(ids) {
      const list = (ids || []).map((id) => sources.find((source) => source.id === id)).filter(Boolean);
      if (!list.length) return "";
      return list.map((source) => `<a href="${source.url}" target="_blank" rel="noreferrer">${escapeHtml(source.id)}</a>`).join(" · ");
    }

    function addMessage(role, html) {
      const node = document.createElement("article");
      node.className = `msg ${role}`;
      node.innerHTML = html;
      chat.appendChild(node);
      chat.scrollTop = chat.scrollHeight;
    }

    function ask(question) {
      const trimmed = question.trim();
      if (!trimmed) return;
      addMessage("user", escapeHtml(trimmed));

      if (mode === "learn") {
        addLearningPath(trimmed);
        return;
      }

      if (mode === "risk") {
        addRiskChecklist(trimmed);
        return;
      }

      const matches = findBest(trimmed);
      const best = matches[0];
      if (!best || best.score <= 0) {
        addMessage("bot", `
          <strong>还没有匹配到足够明确的知识。</strong>
          可以换个关键词，或把这个问题作为新 Q&A 加入知识库。
          ${renderSuggestions(knowledge.slice(0, 6))}
        `);
        wireSuggestionButtons();
        return;
      }

      const related = matches.slice(1, 5).filter((row) => row.score > 0).map((row) => row.item);
      const refs = sourceText(best.item.sources);
      addMessage("bot", `
        <div class="answer-grid">
          <strong>${escapeHtml(best.item.question)}</strong>
          <div>${escapeHtml(best.item.answer)}</div>
          <div class="tag-row">
            <span class="tag">${escapeHtml(best.item.category)}</span>
            <span class="tag warn">匹配度 ${Math.min(98, 54 + best.score * 4)}%</span>
          </div>
          ${refs ? `<div class="source-line">来源：${refs}</div>` : ""}
          ${related.length ? renderSuggestions(related) : ""}
        </div>
      `);
      wireSuggestionButtons();
    }

    function addLearningPath(topic) {
      const picks = ["AIDD 是什么？", "AIDD 入门需要学哪些基础？", "AIDD 的完整研发流程如何搭建？", "虚拟筛选应该怎么做才靠谱？", "什么是 ADMET 预测？", "如何评估一个活性预测模型？"];
      addMessage("bot", `
        <strong>围绕“${escapeHtml(topic)}”的学习路线</strong>
        先建立药物发现全流程，再学数据和模型，最后学习验证与风险治理。建议按下面条目逐个问：
        ${renderSuggestions(picks.map((q) => knowledge.find((item) => item.question === q)).filter(Boolean))}
      `);
      wireSuggestionButtons();
    }

    function addRiskChecklist(topic) {
      addMessage("bot", `
        <strong>“${escapeHtml(topic)}”的 AIDD 风险检查</strong>
        1. 数据是否有单位混用、重复结构、标签噪声和 scaffold 泄漏？<br>
        2. 模型是否做了外部验证、适用域分析和负样本检查？<br>
        3. 候选是否同时评估活性、选择性、ADMET、可合成性和新颖性？<br>
        4. 结构预测或对接结果是否经过口袋、构象和关键相互作用人工审查？<br>
        5. 是否设计了体外、体内或真实世界数据验证路径？
        ${renderSuggestions(["AIDD 项目最常见的数据问题是什么？", "如何避免 AIDD 变成黑箱决策？", "体外验证和体内验证分别解决什么问题？"].map((q) => knowledge.find((item) => item.question === q)).filter(Boolean))}
      `);
      wireSuggestionButtons();
    }

    function renderSuggestions(items) {
      return `<div class="suggestions">${items.map((item) => `<button class="chip" data-question="${escapeAttr(item.question)}">${escapeHtml(item.question)}</button>`).join("")}</div>`;
    }

    function renderTopics() {
      const counts = knowledge.reduce((map, item) => {
        map[item.category] = (map[item.category] || 0) + 1;
        return map;
      }, {});
      const topics = [["全部", knowledge.length], ...Object.entries(counts).sort()];
      totalCount.textContent = `${knowledge.length} 条`;
      topicList.innerHTML = topics.map(([name, count]) => `
        <button class="topic ${name === activeCategory ? "active" : ""}" data-topic="${escapeAttr(name)}">
          <span>${escapeHtml(name)}</span><span class="count">${count}</span>
        </button>
      `).join("");
      document.querySelectorAll(".topic").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.topic;
          renderTopics();
          showCategory(activeCategory);
        });
      });
      renderCategorySelect();
      renderMetrics();
    }

    function renderCategorySelect() {
      categorySelect.innerHTML = categories().map((category) => `<option>${escapeHtml(category)}</option>`).join("");
    }

    function renderMetrics() {
      document.getElementById("metricEntries").textContent = knowledge.length;
      document.getElementById("metricTopics").textContent = categories().length;
      document.getElementById("metricRefs").textContent = sources.length;
    }

    function renderFeatured() {
      const featured = ["AIDD 常用公共数据资源有哪些？", "AIDD 适合新手做的第一个项目是什么？", "FDA 和 EMA 对 AI 药物研发关注什么？", "Open Targets 在靶点发现中怎么用？", "AIDD 知识库下一步怎样升级成真正智能问答？", "生成式 AI 如何用于小分子设计？"]
        .map((q) => knowledge.find((item) => item.question === q))
        .filter(Boolean);
      document.getElementById("featuredList").innerHTML = featured.map((item) => `
        <div class="knowledge-item" data-question="${escapeAttr(item.question)}">
          <strong>${escapeHtml(item.question)}</strong>
          <span>${escapeHtml(item.category)} · ${(item.sources || []).slice(0, 2).join(" ")}</span>
        </div>
      `).join("");
      document.querySelectorAll(".knowledge-item").forEach((node) => {
        node.addEventListener("click", () => ask(node.dataset.question));
      });
    }

    function renderArticles() {
      document.getElementById("articleList").innerHTML = sources.map((source) => `
        <div class="article">
          <a href="${source.url}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a>
          <div class="tag-row">
            <span class="tag">${escapeHtml(source.id)}</span>
            ${source.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
          </div>
        </div>
      `).join("");
    }

    function showCategory(category) {
      const items = category === "全部" ? knowledge : knowledge.filter((item) => item.category === category);
      addMessage("bot", `
        <strong>${escapeHtml(category)} · ${items.length} 条知识</strong>
        ${renderSuggestions(items)}
      `);
      wireSuggestionButtons();
    }

    function performSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      const results = findBest(query).filter((row) => row.score > 0).slice(0, 8).map((row) => row.item);
      chat.innerHTML = "";
      addMessage("bot", `
        <strong>检索结果：${escapeHtml(query)}</strong>
        ${results.length ? renderSuggestions(results) : "没有找到相关条目，可以新增 Q&A 补充。"}
      `);
      wireSuggestionButtons();
    }

    function wireSuggestionButtons() {
      document.querySelectorAll(".chip").forEach((button) => {
        button.onclick = () => ask(button.dataset.question);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    document.getElementById("chatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      ask(questionInput.value);
      questionInput.value = "";
    });

    document.getElementById("searchBtn").addEventListener("click", performSearch);
    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") performSearch();
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        mode = tab.dataset.mode;
        document.querySelectorAll(".tab").forEach((node) => node.classList.toggle("active", node === tab));
      });
    });

    const drawerBtn = document.getElementById("drawerBtn");
    const drawerClose = document.getElementById("drawerClose");
    const drawerScrim = document.getElementById("drawerScrim");
    const closeDrawer = () => document.body.classList.remove("drawer-open");
    drawerBtn.addEventListener("click", () => document.body.classList.add("drawer-open"));
    drawerClose.addEventListener("click", closeDrawer);
    drawerScrim.addEventListener("click", closeDrawer);

    document.getElementById("addBtn").addEventListener("click", () => modal.classList.add("open"));
    document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (event) => {
      if (event.target === modal) modal.classList.remove("open");
    });

    document.getElementById("qaForm").addEventListener("submit", (event) => {
      event.preventDefault();
      knowledge.unshift({
        question: document.getElementById("qaQuestion").value.trim(),
        category: document.getElementById("qaCategory").value,
        keywords: document.getElementById("qaKeywords").value.split(",").map((item) => item.trim()).filter(Boolean),
        sources: document.getElementById("qaSources").value.split(",").map((item) => item.trim()).filter(Boolean),
        answer: document.getElementById("qaAnswer").value.trim()
      });
      saveKnowledge();
      renderTopics();
      renderFeatured();
      event.target.reset();
      modal.classList.remove("open");
      addMessage("bot", "<strong>已保存新知识条目。</strong>它已经进入本地知识库，可以被搜索和问答匹配。");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(knowledge, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "aidd-knowledge-base.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("fileInput").click());
    document.getElementById("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        if (!Array.isArray(imported)) throw new Error("知识库必须是数组");
        knowledge = imported.filter((item) => item.question && item.answer).map((item) => ({
          question: String(item.question),
          answer: String(item.answer),
          category: String(item.category || "未分类"),
          keywords: Array.isArray(item.keywords) ? item.keywords.map(String) : [],
          sources: Array.isArray(item.sources) ? item.sources.map(String) : []
        }));
        saveKnowledge();
        renderTopics();
        renderFeatured();
        addMessage("bot", `<strong>导入完成。</strong>当前知识库共有 ${knowledge.length} 条。`);
      } catch (error) {
        addMessage("bot", `<strong>导入失败。</strong>${escapeHtml(error.message)}`);
      }
      event.target.value = "";
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      knowledge = starterKnowledge;
      saveKnowledge();
      renderTopics();
      renderFeatured();
      chat.innerHTML = "";
      boot();
    });

    function boot() {
      addMessage("bot", `
        <strong>你好，我是 AIDD Knowledge Copilot。</strong>
        直接问我 AIDD、靶点发现、虚拟筛选、生成式分子设计、ADMET、AlphaFold、实验验证或项目落地问题。
        ${renderSuggestions(["AIDD 常用公共数据资源有哪些？", "AIDD 适合新手做的第一个项目是什么？", "Open Targets 在靶点发现中怎么用？", "FDA 和 EMA 对 AI 药物研发关注什么？", "AIDD 知识库下一步怎样升级成真正智能问答？", "生成式 AI 如何用于小分子设计？"].map((q) => knowledge.find((item) => item.question === q)).filter(Boolean))}
      `);
      wireSuggestionButtons();
    }

    renderTopics();
    renderFeatured();
    renderArticles();
    boot();
  </script>
</body>
</html>
